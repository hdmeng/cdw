<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Partnering Plan</title>
<style>
    html, body { margin: 0; background: #f8fafc; font-family: sans-serif; color: #0f172a; }
    .page-header {
        display: flex; align-items: center; justify-content: space-between;
        gap: 12px; padding: 12px 16px; background: #165391; color: #ffffff;
    }
    .page-header h1 { margin: 0; font-size: 18px; }
    .page-header a { color: #dbeafe; text-decoration: none; font-weight: 600; }
    .page-header a:hover { text-decoration: underline; }
    .plan-wrap {
        position: relative;
        display: grid;
        grid-template-columns: 330px minmax(520px, 1fr) 330px;
        gap: 18px;
        align-items: start;
        padding: 18px;
        max-width: 1900px;
        margin: 0 auto;
    }
    .gutter { position: relative; }
    .diagram-card {
        position: relative;
        background: #ffffff;
        border: 1px solid #cbd5e1;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
        padding: 10px;
    }
    .plan-svg { display: block; width: 100%; height: auto; }
    .box-ring {
        position: absolute;
        border: 3px solid #f59e0b;
        border-radius: 6px;
        box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.25);
        opacity: 0;
        transition: opacity 0.15s ease;
        pointer-events: auto;
    }
    .box-ring.active { opacity: 1; }
    .partner-card {
        position: absolute;
        left: 0; right: 0;
        background: #ffffff;
        border: 1px solid #cbd5e1;
        border-radius: 12px;
        box-shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
        padding: 10px 12px 12px;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .partner-card.active { border-color: #f59e0b; box-shadow: 0 4px 18px rgba(245, 158, 11, 0.45); }
    .partner-card h3 { margin: 0 0 4px; font-size: 14px; color: #165391; }
    .partner-card h3 .domain { font-weight: 400; color: #64748b; font-size: 12px; margin-left: 6px; }
    .partner-card .abstract { margin: 0 0 8px; font-size: 12px; line-height: 1.45; color: #334155; }
    .preview {
        position: relative;
        width: 100%;
        height: 176px;
        overflow: hidden;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        background: #eef2f7;
    }
    .preview iframe {
        width: 1280px; height: 800px;
        border: 0;
        transform-origin: 0 0;
        pointer-events: none;
        background: #ffffff;
    }
    .preview .open-link {
        position: absolute; inset: 0;
        display: block;
        color: transparent;
    }
    .preview .open-badge {
        position: absolute; right: 6px; bottom: 6px;
        background: rgba(22, 83, 145, 0.92);
        color: #ffffff;
        font-size: 11px; font-weight: 600;
        padding: 3px 8px;
        border-radius: 999px;
        pointer-events: none;
    }
    .connector-layer {
        position: absolute; inset: 0;
        pointer-events: none;
        z-index: 5;
    }
    .connector-layer line {
        stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 4;
    }
    .connector-layer line.active { stroke: #f59e0b; stroke-width: 2.5; stroke-dasharray: none; }
    .page-note { max-width: 1900px; margin: 0 auto; padding: 0 18px 18px; color: #64748b; font-size: 12px; }
    @media (max-width: 1280px) {
        .plan-wrap { display: block; }
        .gutter { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; margin-top: 16px; }
        .partner-card { position: static; }
        .connector-layer { display: none; }
    }
</style>
</head>

    <p class="page-note">Hover a card to highlight the related box in the diagram. Each small window is a live preview of the linked website &mdash; click it to open the site in a new tab.</p>
<script>
const VIEW_W = 960, VIEW_H = 720;
const PARTNERS = [
    {
        id: 'vizzion', side: 'left', name: 'Vizzion', domain: 'vizzion.com',
        url: 'https://vizzion.com', box: { x: 45.3, y: 70.4, w: 180.9, h: 96.4 },
        abstract: 'Road imagery APIs from 100,000+ traffic and on-vehicle cameras across 600+ markets in 30+ countries \u2014 real-time visual verification of traffic, incidents, weather and road conditions.'
    },
    {
        id: 'roaddata', side: 'left', name: 'RoadData.AI', domain: 'roaddata.ai',
        url: 'https://roaddata.ai', box: { x: 45.3, y: 205.5, w: 180.9, h: 64.3 },
        abstract: 'AI platform that turns real-time imagery from thousands of nationwide road cameras into 20+ extracted data elements (vehicles, traffic conditions, infrastructure) for enterprises, cities and AV developers.'
    },
    {
        id: 'beemaps', side: 'left', name: 'Bee Maps', domain: 'beemaps.com',
        url: 'https://beemaps.com', box: { x: 45.3, y: 301.5, w: 180.9, h: 64.3 },
        abstract: 'Hivemapper\u2019s Bee dashcam network \u2014 fresh street-level video and imagery for physical AI, refreshed in days rather than years, with APIs for continuously updated geospatial data.'
    },
    {
        id: 'simforge', side: 'left', name: 'SimForge', domain: 'simforge.ai',
        url: 'https://simforge.ai', box: { x: 45.3, y: 398.0, w: 180.9, h: 96.4 },
        abstract: 'Data infrastructure for physical AI: captures real-world locations as high-fidelity digital twins and runs CARLA-based scenario simulation to generate multi-sensor training data.'
    },
    {
        id: 'consortium', side: 'right', name: 'Data Supplier Consortium', domain: 'daily probing heatmap',
        url: './#heatmap', previewSrc: './camera-map-source.html', previewScrollTo: 'heatmap',
        box: { x: 419.0, y: 245.9, w: 102.4, h: 104.0 },
        abstract: 'DriveAI\u2019s supplier consortium feeds probe-vehicle data into this site\u2019s own dashboard \u2014 the Daily Probing Heatmap shows the roadway coverage collected each day.'
    },
    {
        id: 'analytics', side: 'right', name: 'Analytics, Fusion & Publishing', domain: 'capstone.preyneyv.dev',
        url: 'https://capstone.preyneyv.dev/', box: { x: 521.4, y: 245.9, w: 118.5, h: 104.0 },
        abstract: 'UC Berkeley PATH capstone project site demonstrating the drive-data analytics pipeline with visual odometry and Street View integration.'
    },
    {
        id: 'oss', side: 'right', name: 'Caltrans One-Stop-Shop', domain: 'oss.weathershare.org',
        url: 'https://oss.weathershare.org/?clat=37.50479&clng=-122.15128&zoom=9', box: { x: 714.5, y: 141.2, w: 229.1, h: 32.1 },
        abstract: 'One-Stop-Shop for rural traveler information \u2014 aggregates real-time road and travel conditions (incidents, chain controls, weather, fire detections, CCTV) across Western U.S. corridors.'
    },
    {
        id: 'cwwp2', side: 'right', name: 'Caltrans CWWP2', domain: 'cwwp2.dot.ca.gov',
        url: 'https://cwwp2.dot.ca.gov/', box: { x: 714.5, y: 173.3, w: 229.1, h: 32.1 },
        abstract: 'Caltrans Commercial Wholesale Web Portal \u2014 real-time traveler information aggregated from all 12 Caltrans districts, downloadable in multiple data formats.'
    }
];

const diagramCard = document.getElementById('diagramCard');
const planWrap = document.getElementById('planWrap');
const connectorLayer = document.getElementById('connectorLayer');
const gutters = { left: document.getElementById('gutterLeft'), right: document.getElementById('gutterRight') };
const rings = {}, cards = {}, connectors = {};

function setActive(id, on) {
    rings[id].classList.toggle('active', on);
    cards[id].classList.toggle('active', on);
    if (connectors[id]) connectors[id].classList.toggle('active', on);
}

PARTNERS.forEach(partner => {
    const ring = document.createElement('div');
    ring.className = 'box-ring';
    diagramCard.appendChild(ring);
    rings[partner.id] = ring;

    const card = document.createElement('article');
    card.className = 'partner-card';
    card.innerHTML = `
        <h3>${partner.name}<span class="domain">${partner.domain}</span></h3>
        <p class="abstract">${partner.abstract}</p>
        <div class="preview">
            <iframe loading="lazy" referrerpolicy="no-referrer" tabindex="-1"
                    src="${partner.previewSrc || partner.url}" title="Preview of ${partner.name}"></iframe>
            <a class="open-link" href="${partner.url}" target="_blank" rel="noopener"
               aria-label="Open ${partner.name}">Open ${partner.name}</a>
            <span class="open-badge">Open &#8599;</span>
        </div>`;
    gutters[partner.side].appendChild(card);
    cards[partner.id] = card;

    if (partner.previewScrollTo) {
        // scroll the (same-origin) preview to its section without a URL hash,
        // so the fragment navigation cannot scroll this page too
        const iframe = card.querySelector('iframe');
        iframe.addEventListener('load', () => {
            const scrollInner = () => {
                try {
                    const target = iframe.contentDocument.getElementById(partner.previewScrollTo);
                    if (target) iframe.contentWindow.scrollTo(0, target.offsetTop);
                } catch (e) { /* ignore */ }
            };
            scrollInner();
            setTimeout(scrollInner, 1500);
            setTimeout(scrollInner, 4000);
        });
    }

    [card, ring].forEach(el => {
        el.addEventListener('mouseenter', () => setActive(partner.id, true));
        el.addEventListener('mouseleave', () => setActive(partner.id, false));
    });
});

function layout() {
    const svgEl = document.querySelector('.plan-svg');
    const svgRect = svgEl.getBoundingClientRect();
    const cardRect = diagramCard.getBoundingClientRect();
    const scaleX = svgRect.width / VIEW_W, scaleY = svgRect.height / VIEW_H;
    const padX = svgRect.left - cardRect.left, padY = svgRect.top - cardRect.top;

    PARTNERS.forEach(partner => {
        const ring = rings[partner.id], b = partner.box;
        ring.style.left = (padX + b.x * scaleX - 5) + 'px';
        ring.style.top = (padY + b.y * scaleY - 5) + 'px';
        ring.style.width = (b.w * scaleX + 4) + 'px';
        ring.style.height = (b.h * scaleY + 4) + 'px';
    });

    // scale preview iframes to their container width
    document.querySelectorAll('.preview').forEach(preview => {
        const iframe = preview.querySelector('iframe');
        const scale = preview.clientWidth / 1280;
        iframe.style.transform = `scale(${scale})`;
        preview.style.height = Math.round(800 * scale) + 'px';
    });

    const wide = window.matchMedia('(min-width: 1281px)').matches;
    connectorLayer.style.display = wide ? '' : 'none';
    if (!wide) { PARTNERS.forEach(p => { cards[p.id].style.top = ''; }); return; }

    // align cards with their box centers, then resolve overlaps top-down
    const wrapRect = planWrap.getBoundingClientRect();
    ['left', 'right'].forEach(side => {
        const gutterRect = gutters[side].getBoundingClientRect();
        const list = PARTNERS.filter(p => p.side === side)
            .sort((a, b) => (a.box.y + a.box.h / 2) - (b.box.y + b.box.h / 2));
        let cursor = 0;
        list.forEach(partner => {
            const card = cards[partner.id];
            const boxCenter = (cardRect.top - gutterRect.top) + padY
                + (partner.box.y + partner.box.h / 2) * scaleY;
            let top = boxCenter - card.offsetHeight / 2;
            top = Math.max(top, cursor);
            card.style.top = top + 'px';
            cursor = top + card.offsetHeight + 14;
        });
        gutters[side].style.minHeight = cursor + 'px';
    });

    // connectors from card edge to box edge
    connectorLayer.innerHTML = '';
    connectorLayer.setAttribute('width', wrapRect.width);
    connectorLayer.setAttribute('height', planWrap.scrollHeight);
    connectorLayer.setAttribute('viewBox', `0 0 ${wrapRect.width} ${planWrap.scrollHeight}`);
    PARTNERS.forEach(partner => {
        const card = cards[partner.id], b = partner.box;
        const cardBox = card.getBoundingClientRect();
        const x1 = partner.side === 'left' ? cardBox.right - wrapRect.left : cardBox.left - wrapRect.left;
        const y1 = cardBox.top + cardBox.height / 2 - wrapRect.top;
        const boxEdgeX = partner.side === 'left' ? b.x : b.x + b.w;
        const x2 = cardRect.left - wrapRect.left + padX + boxEdgeX * scaleX;
        const y2 = cardRect.top - wrapRect.top + padY + (b.y + b.h / 2) * scaleY;
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', x1); line.setAttribute('y1', y1);
        line.setAttribute('x2', x2); line.setAttribute('y2', y2);
        connectorLayer.appendChild(line);
        connectors[partner.id] = line;
    });
}

window.addEventListener('load', layout);
window.addEventListener('resize', layout);
layout();
</script>
